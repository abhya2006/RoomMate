spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: roommate-api
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${MYSQL_DATABASE:roommate}?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: ${MYSQL_USER:rool}
    password: ${MYSQL_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          connectiontimeout: ${MAIL_CONNECTION_TIMEOUT:10000}
          timeout: ${MAIL_TIMEOUT:10000}
          writetimeout: ${MAIL_WRITE_TIMEOUT:10000}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}
  security:
    jwt-secret: ${JWT_SECRET:change-this-local-secret-to-a-random-32-character-value}
    jwt-expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
    aadhaar-hash-secret: ${AADHAAR_HASH_SECRET:change-this-aadhaar-hash-secret-locally}
  digilocker:
    client-id: ${DIGILOCKER_CLIENT_ID:}
    client-secret: ${DIGILOCKER_CLIENT_SECRET:}
    authorization-url: ${DIGILOCKER_AUTHORIZATION_URL:}
  password-reset:
    url: ${PASSWORD_RESET_URL:http://localhost:3000/reset-password}
    expiration-minutes: ${PASSWORD_RESET_EXPIRATION_MINUTES:15}
  otp:
    expiry-seconds: ${OTP_EXPIRY_SECONDS:300}
    delivery-mode: ${APP_OTP_DELIVERY_MODE:email}
  msg91:
    auth-key: ${MSG91_AUTH_KEY:}
    template-id: ${MSG91_TEMPLATE_ID:}
