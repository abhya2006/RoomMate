name: Forgot password verify OTP
method: POST
url: '{{baseUrl}}/api/v1/auth/forgot-password/verify-otp'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "challengeId": "challenge-id-from-forgot-password",
      "emailOtp": "123456",
      "phoneOtp": "123456",
      "newPassword": "NewStrongPass@@123"
    }
